name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B package

      - name: Checksums
        shell: bash
        run: |
          cd target
          sha256sum LumenixLauncher.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: ZIP
        shell: bash
        run: |
          mkdir -p dist
          cp target/LumenixLauncher.jar dist/
          cp target/SHA256SUMS.txt dist/
          cp README.md dist/ 2>/dev/null || true
          cd dist && powershell -Command "Compress-Archive -Path * -DestinationPath ../LumenixLauncher-${{ steps.ver.outputs.version }}-windows.zip -Force"

      - name: jpackage
        shell: bash
        run: |
          mkdir -p jpackage-in
          cp target/LumenixLauncher.jar jpackage-in/
          jpackage --type app-image --name LumenixLauncher --input jpackage-in \
            --main-jar LumenixLauncher.jar \
            --main-class com.lumenix.launcher.LumenixLauncher \
            --dest jpackage-out \
            --app-version "${{ steps.ver.outputs.version }}" \
            || true
          if [ -d jpackage-out/LumenixLauncher ]; then
            cd jpackage-out && powershell -Command "Compress-Archive -Path LumenixLauncher -DestinationPath ../LumenixLauncher-${{ steps.ver.outputs.version }}-appimage.zip -Force"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Lumenix Launcher v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            target/LumenixLauncher.jar
            target/SHA256SUMS.txt
            LumenixLauncher-${{ steps.ver.outputs.version }}-windows.zip
            LumenixLauncher-${{ steps.ver.outputs.version }}-appimage.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
